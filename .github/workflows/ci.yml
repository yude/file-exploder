name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: Server/go.mod
          cache-dependency-path: Server/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test -count=1 -race ./...
      - run: go build -buildvcs=false ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The two scripts users are told to run are not covered by anything else
      # here, so a syntax error in either only surfaces when someone runs it.
      - name: Check shell scripts parse
        run: |
          bash -n Server/install.sh
          bash -n Client/build_mac.sh

  client:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test
