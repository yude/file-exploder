name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: Server/go.mod
          cache-dependency-path: Server/go.sum
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test -count=1 -race ./...
      - run: go build -buildvcs=false ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The two scripts users are told to run are not covered by anything else
      # here, so a syntax error in either only surfaces when someone runs it.
      - name: Check shell scripts parse
        run: |
          bash -n Server/install.sh
          bash -n Client/build_mac.sh

      - name: Check systemd units
        run: |
          # systemd-analyze reports a bad directive and then exits 0 anyway, so
          # treat any output as the failure. systemd does the same at runtime -
          # it logs "Failed to parse ... ignoring" and carries on - which is why
          # a typo in a unit would otherwise only show up as a service quietly
          # not restarting.
          #
          # Both units name the binary install.sh puts in place; stub it so the
          # check is about the unit rather than about the build.
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\n' > "$HOME/.local/bin/file-exploder"
          chmod +x "$HOME/.local/bin/file-exploder"
          sudo install -m 0755 "$HOME/.local/bin/file-exploder" /usr/local/bin/file-exploder
          status=0
          for unit in Server/file-exploder.service Server/file-exploder-system.service; do
            output="$(systemd-analyze verify "$unit" 2>&1)" || true
            if [ -n "$output" ]; then
              echo "$unit:"
              echo "$output"
              status=1
            fi
          done
          exit "$status"

  client:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test

  windows-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version-file: Server/go.mod
          cache-dependency-path: Server/go.sum

      # WindowsClient/FileExploder.Tests' "Local SSH" tests (SftpService,
      # the ViewModels, the headless UI smoke tests) exercise the real
      # file-exploder daemon over a real SSH connection, the same way local
      # development does - so both need to be up before `dotnet test`, not
      # just the .NET toolchain.
      - name: Build and start the file-exploder daemon
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -buildvcs=false -o "$HOME/.local/bin/file-exploder" .
          nohup "$HOME/.local/bin/file-exploder" daemon > /tmp/file-exploder-daemon.log 2>&1 &
        working-directory: Server
      - name: Start a local SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo service ssh start

      - run: dotnet build FileExploder.slnx
        working-directory: WindowsClient
      - run: dotnet test FileExploder.slnx
        working-directory: WindowsClient
      # Not published anywhere - this only confirms the project still
      # produces a genuine win-x64 executable, the same check used
      # throughout development since this CI runner (like the dev sandbox)
      # can't run one.
      - run: dotnet publish FileExploder/FileExploder.csproj -c Release -r win-x64 --self-contained false
        working-directory: WindowsClient
